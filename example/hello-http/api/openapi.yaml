openapi: 3.1.0
info:
  title: Hello HTTP Example
  version: 0.1.0
paths:
  /hello/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: get_hello
      x-nucleus-priority: 10
      parameters:
        - name: trace_id
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Greeting response.
        "404":
          description: Greeting target was not found.
